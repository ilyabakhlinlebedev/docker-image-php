runs:
  steps:
    - uses: docker/setup-buildx-action@v3
    - uses: docker/build-push-action@v6
      with:
        cache-from: type=gha
        cache-to: type=gha,mode=max
        context: debian/bookworm/openssl/3.0.16
        outputs: type=local,dest=debian/bookworm/openssl/3.0.16
        platforms: linux/amd64
    - uses: actions/upload-artifact@v4
      with:
        name: openssl-3.0.16
        path: debian/bookworm/openssl/3.0.16/opt/openssl/3.0.16
        retention-days: 8
  using: composite
