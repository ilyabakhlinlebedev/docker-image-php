runs:
  steps:
    - uses: actions/download-artifact@v4
      with:
        name: zlib-1.2.13
        path: debian/bookworm/libxml2/2.9.14/opt/zlib/1.2.13
    - uses: docker/setup-buildx-action@v3
    - uses: docker/build-push-action@v6
      with:
        context: debian/bookworm/libxml2/2.9.14
        outputs: type=local,dest=debian/bookworm/libxml2/2.9.14
        platforms: linux/amd64
    - uses: actions/upload-artifact@v4
      with:
        name: libxml2-2.9.14
        path: debian/bookworm/libxml2/2.9.14/opt/libxml2/2.9.14
        retention-days: 8
  using: composite
