runs:
  steps:
    - uses: docker/setup-buildx-action@v3
    - uses: docker/build-push-action@v6
      with:
        cache-from: type=gha
        cache-to: type=gha,mode=max
        context: debian/bookworm/oniguruma/6.9.10
        outputs: type=local,dest=debian/bookworm/oniguruma/6.9.10
        platforms: linux/amd64
    - uses: actions/upload-artifact@v4
      with:
        name: oniguruma-6.9.10
        path: debian/bookworm/oniguruma/6.9.10/opt/oniguruma/6.9.10
        retention-days: 8
  using: composite
