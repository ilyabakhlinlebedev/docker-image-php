runs:
  steps:
    - uses: actions/download-artifact@v4
      with:
        name: brotli-1.1.0
        path: debian/bookworm/curl/7.88.1/opt/brotli/1.1.0
    - uses: actions/download-artifact@v4
      with:
        name: openssl-3.0.16
        path: debian/bookworm/curl/7.88.1/opt/openssl/3.0.16
    - uses: actions/download-artifact@v4
      with:
        name: zlib-1.2.13
        path: debian/bookworm/curl/7.88.1/opt/zlib/1.2.13
    - uses: actions/download-artifact@v4
      with:
        name: zstd-1.5.7
        path: debian/bookworm/curl/7.88.1/opt/zstd/1.5.7
    - uses: docker/setup-buildx-action@v3
    - uses: docker/build-push-action@v6
      with:
        context: debian/bookworm/curl/7.88.1
        outputs: type=local,dest=debian/bookworm/curl/7.88.1
        platforms: linux/amd64
    - uses: actions/upload-artifact@v4
      with:
        name: curl-7.88.1
        path: debian/bookworm/curl/7.88.1/opt/curl/7.88.1
        retention-days: 8
  using: composite
