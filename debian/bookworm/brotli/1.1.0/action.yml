runs:
  steps:
    - uses: docker/setup-buildx-action@v3
    - uses: docker/build-push-action@v6
      with:
        cache-from: type=gha
        cache-to: type=gha,mode=max
        context: debian/bookworm/brotli/1.1.0
        outputs: type=local,dest=debian/bookworm/brotli/1.1.0
        platforms: linux/amd64
    - uses: actions/upload-artifact@v4
      with:
        name: brotli-1.1.0
        path: debian/bookworm/brotli/1.1.0/opt/brotli/1.1.0
        retention-days: 8
  using: composite
