jobs:
  build-brotli:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./debian/bookworm/brotli/1.1.0
  build-curl:
    needs:
      - build-brotli
      - build-openssl
      - build-zlib
      - build-zstd
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./debian/bookworm/curl/7.88.1
  build-iconv:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./debian/bookworm/iconv/1.18.0
  build-icu:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./debian/bookworm/icu/77.1.0
  build-libxml2:
    needs:
      - build-zlib
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./debian/bookworm/libxml2/2.9.14
  build-libzip:
    needs:
      - build-openssl
      - build-zlib
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./debian/bookworm/libzip/1.11.4
  build-ncurses:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./debian/bookworm/ncurses/6.5.0
  build-oniguruma:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./debian/bookworm/oniguruma/6.9.10
  build-openssl:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./debian/bookworm/openssl/3.0.16
  build-php:
    needs:
      - build-brotli
      - build-curl
      - build-iconv
      - build-icu
      - build-libxml2
      - build-libzip
      - build-ncurses
      - build-oniguruma
      - build-openssl
      - build-readline
      - build-sqlite
      - build-zlib
      - build-zstd
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: brotli-1.1.0
          path: debian/bookworm/php/8.3.24/opt/brotli/1.1.0
      - uses: actions/download-artifact@v4
        with:
          name: curl-7.88.1
          path: debian/bookworm/php/8.3.24/opt/curl/7.88.1
      - uses: actions/download-artifact@v4
        with:
          name: iconv-1.18.0
          path: debian/bookworm/php/8.3.24/opt/iconv/1.18.0
      - uses: actions/download-artifact@v4
        with:
          name: icu-77.1.0
          path: debian/bookworm/php/8.3.24/opt/icu/77.1.0
      - uses: actions/download-artifact@v4
        with:
          name: libxml2-2.9.14
          path: debian/bookworm/php/8.3.24/opt/libxml2/2.9.14
      - uses: actions/download-artifact@v4
        with:
          name: libzip-1.11.4
          path: debian/bookworm/php/8.3.24/opt/libzip/1.11.4
      - uses: actions/download-artifact@v4
        with:
          name: ncurses-6.5.0
          path: debian/bookworm/php/8.3.24/opt/ncurses/6.5.0
      - uses: actions/download-artifact@v4
        with:
          name: oniguruma-6.9.10
          path: debian/bookworm/php/8.3.24/opt/oniguruma/6.9.10
      - uses: actions/download-artifact@v4
        with:
          name: openssl-3.0.16
          path: debian/bookworm/php/8.3.24/opt/openssl/3.0.16
      - uses: actions/download-artifact@v4
        with:
          name: readline-8.2.0
          path: debian/bookworm/php/8.3.24/opt/readline/8.2.0
      - uses: actions/download-artifact@v4
        with:
          name: sqlite-3.50.4
          path: debian/bookworm/php/8.3.24/opt/sqlite/3.50.4
      - uses: actions/download-artifact@v4
        with:
          name: zlib-1.2.13
          path: debian/bookworm/php/8.3.24/opt/zlib/1.2.13
      - uses: actions/download-artifact@v4
        with:
          name: zstd-1.5.7
          path: debian/bookworm/php/8.3.24/opt/zstd/1.5.7
      - uses: docker/login-action@v3
        with:
          password: ${{ secrets.DOCKER_HUB_TOKEN }}
          username: ${{ vars.DOCKER_HUB_USERNAME }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: debian/bookworm/php/8.3.24
          platforms: linux/amd64
          push: true
          tags: ilyabakhlinlebedev/php:8.3.24-dev,ilyabakhlinlebedev/php:8.3-dev
          target: php-dev
      - uses: docker/build-push-action@v6
        with:
          context: debian/bookworm/php/8.3.24
          platforms: linux/amd64
          push: true
          tags: ilyabakhlinlebedev/php:8.3.24,ilyabakhlinlebedev/php:8.3
          target: php-pro
  build-readline:
    needs:
      - build-ncurses
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./debian/bookworm/readline/8.2.0
  build-sqlite:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./debian/bookworm/sqlite/3.50.4
  build-zlib:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./debian/bookworm/zlib/1.2.13
  build-zstd:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./debian/bookworm/zstd/1.5.7
name: PHP 8.3.24
on:
  push:
    branches:
      - pro
